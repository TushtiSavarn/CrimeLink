    <script>
       function generateReport() {
    let selectedType = document.querySelector('input[name="reportType"]:checked');

    if (!selectedType) {
        alert("Please select a report type!");
        return;
    }

    let type = selectedType.value;

    fetch("fetch_analysis.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "type=" + type
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            console.log(data);
            displayReport(data);
        }
    })
    .catch(error => console.error("Error:", error));
}

function displayReport(data) {
    let reportWindow = window.open("", "ReportWindow", "width=800,height=600");
    reportWindow.document.write("<h2>Generated Report</h2>");
    reportWindow.document.write("<table border='1'><tr><th>Case ID</th><th>Title</th><th>Description</th><th>Date</th></tr>");

    data.forEach(row => {
        reportWindow.document.write(<tr><td>${row.case_id}</td><td>${row.case_title}</td><td>${row.description}</td><td>${row.report_date}</td></tr>);
    });

    reportWindow.document.write("</table>");
}

function displayAnalysis(data) {
    let analysisWindow = window.open("", "AnalysisWindow", "width=800,height=600");
    analysisWindow.document.write("<h2>Database Analysis</h2>");
    analysisWindow.document.write("<table border='1'><tr><th>Category</th><th>Total</th></tr>");

    data.forEach(row => {
        let key = row.category ? row.category : row.officer_name;
        analysisWindow.document.write(<tr><td>${key}</td><td>${row.total}</td></tr>);
    });

    analysisWindow.document.write("</table>");
}

    </script>
