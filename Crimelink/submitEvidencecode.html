<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Crime Evidence</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <style>
        /* Header Styling */
        .headerr {
            height: 80px;
            width: 100%;
            background-color: #002244;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo {
            height: 100px;
            width: auto;
            max-width: 180px;
        }

        .site-name {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
        }

        /* General Styling */
        body {
            background: linear-gradient(135deg, #002244, #003366);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
        }

        /* Form Styling */
        .form {
            background: rgba(255, 255, 255, 0.97);
            color: #333;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            padding: 40px 60px;
            width: 500px;
            text-align: center;
            margin-top: 40px;
        }

        .label {
            font-size: 16px;
            font-weight: 600;
            color: #002244;
            display: block;
            margin-bottom: 8px;
            margin-top: 15px;
            text-align: left;
            padding-left: 10px;
        }

        .form-group {
            width: 90%;
            margin: 0 auto;
        }

        input[type="text"],
        input[type="file"] {
            width: 90%;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #002244;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .signup-btn {
            width: 90%;
            margin: 20px auto;
        }

        /* File Upload Styling */
        input[type="file"] {
            background: #f8f9fa;
            padding: 20px;
            border: 2px dashed #002244;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* Submit Button */
        .signup-btn {
            background: #002244;
            color: #fff;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        .signup-btn:hover {
            background: #003366;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 34, 68, 0.3);
        }

        /* File Upload Styling */
        input[type="file"] {
            background: #f8f9fa;
            padding: 15px;
            border: 2px dashed #002244;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #003366;
            background: #f1f3f5;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="headerr">
        <a href="home.html" class="logo-container">
            <img src="logo.png" alt="CrimeLink Logo" class="logo">
            <span class="site-name">CrimeLink</span>
        </a>
    </div>
    <form action="upload.php" class="form" method="post" enctype="multipart/form-data">
        <div id="successMessage" style="display: none; background-color: #4CAF50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            Evidence submitted successfully!
        </div>
        <div class="form-group">
            <label class="label">Report id</label>
            <input type="text" id="reportid" name="reportid">
            
            <label class="label">Upload photo</label>
            <input type="file" id="image" name="image" class="img" accept="image/*">

            <label class="label">Upload document</label>
            <input type="file" id="document" name="document" accept=".pdf, .docx, .txt">

            <button type="submit" class="signup-btn">Submit Evidence</button>
        </div>
    </form>
   
    <script>
        // Check if there's a success parameter in the URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            document.getElementById('successMessage').style.display = 'block';
            // Redirect to home page after 2 seconds
            setTimeout(() => {
                window.location.href = 'homee.html';
            }, 2000);
        }
    </script>
</body>
</html>
